<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="Isopod_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isopod - Self-hosted Minecraft Server Manager</title>
    <meta name="description" content="Isopod is a free, open-source, Docker-powered dashboard for self-hosted Minecraft servers: Java and Bedrock, Modrinth and CurseForge mods and modpacks, backups, and cross-play." />
    <!-- Link previews (LinkedIn, Discord, Slack, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isopod" />
    <meta property="og:title" content="Isopod: Self-hosted Minecraft servers, managed like Prism instances" />
    <meta property="og:description" content="A free, open-source, Docker-powered dashboard for Java and Bedrock servers, mods, modpacks, and backups." />
    <meta property="og:url" content="https://isopod-project.github.io/Isopod-Website/" />
    <meta property="og:image" content="https://isopod-project.github.io/Isopod-Website/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Isopod logo and tagline next to a screenshot of the dashboard" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)" />
    <!-- Resolve the theme before first paint so there is no flash (see src/theme.ts) -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('isopod-theme') || 'system'; } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
